<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07150f">
    <title>MycoVerse</title>
    <link rel="icon" href="Icons/MycoVerseFavicon.png">
    <link rel="stylesheet" href="lib/bootstrap.min.css">
    <link rel="stylesheet" href="lib/pnotify.custom.min.css">

<body class="mycoverse-modern-core">
    <div id="loadScreen" class="myco-loadscreen">
        <div class="myco-modern-loader">
            <div class="myco-modern-loader-mark">🍄</div>
            <h1>MYCOVERSE</h1>
            <p>Awakening the living network…</p>
        </div>
    </div>

    <main id="game" class="container myco-shell">
        <header class="myco-modern-header">
            <div>
                <div class="myco-eyebrow">LIVING COLONY NETWORK</div>
                <h1>MycoVerse</h1>
            </div>
            <div class="myco-modern-header-meta">
                <span id="versionLabel">MycoVerse</span>
                <button class="btn btn-default" onclick="Game.save(false)">Save</button>
            </div>
        </header>

        <div id="updateBox"></div>

        <nav class="myco-system-navigation" aria-label="Game systems">
            <ul id="tabList" class="nav nav-tabs" role="tablist"><li role="presentation" id="settingsTopTab"><a href="#uiTab" aria-controls="uiTab" role="tab" data-toggle="tab"><span class="glyphicon glyphicon-cog"></span> Settings</a></li></ul>
        </nav>

        <section id="tabContent" class="tab-content">
            <div role="tabpanel" class="tab-pane fade" id="uiTab">
                <section class="myco-panel">
                    <div class="myco-eyebrow">INTERFACE</div>
                    <h2>Settings</h2>
                    <table class="table"><tbody></tbody></table>
                </section>
                <section class="myco-panel myco-save-tools">
                    <div class="myco-eyebrow">LOCAL SAVE TOOLS</div>
                    <h3>Backup & Restore</h3>
                    <textarea id="impexpField" class="form-control" rows="4" placeholder="Exported save code"></textarea>
                    <div class="myco-save-actions">
                        <button class="btn btn-default" onclick="Game.export()">Export</button>
                        <button class="btn btn-primary" onclick="Game.import()">Import</button>
                        <button class="btn btn-danger" onclick="Game.deleteSave()">Delete Save</button>
                    </div>
                </section>
            </div>
        </section>
    </main>
